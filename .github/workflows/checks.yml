name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXT_PUBLIC_APP_URL: https://whooper-peach.vercel.app
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW1lcmdpbmctcmF5LTUxMzAuY2xlcmsuYWNjb3VudHMuZGV2JA
